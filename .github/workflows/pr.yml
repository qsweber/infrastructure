name: Pull Request Workflow

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: cdk

permissions:
  id-token: write # for AWS OIDC (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
          cache-dependency-path: cdk/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l *.go)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Install CDK CLI
        run: npm ci
      - name: Validate CDK app synthesizes
        run: npx cdk synth --all
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::120356305272:role/github-actions-deploy
          aws-region: us-west-2
      - name: CDK diff
        run: npx cdk diff github-actions-deploy
